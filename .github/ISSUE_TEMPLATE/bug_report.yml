name: Bug report
description: Report a crash, visual issue, or other bug with dlssg-to-xefg
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out this form as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Launch the game with ...
        2. Enable ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      description: Which game did you experience the issue with?
      placeholder: e.g. Cyberpunk 2077 2.5
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: Which GPU are you using, and which driver version?
      placeholder: e.g. RX 7800 XT, driver 26.10.2
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: upload
    id: log
    attributes:
      label: Log file
      description: >-
        Upload `dlssg_to_xefg_intel_is_better.log`. The log is written next to the DLL (usually in `XeMFG XMX\dlssg\`).
        Do not paste the contents; upload the file itself.
    validations:
      required: true
